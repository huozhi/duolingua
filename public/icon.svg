<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Duolingua</title>
  <desc id="description">Three nested monochrome speech bubbles fading into the background.</desc>
  <defs>
    <filter id="far-blur" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="near-blur" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <path
      id="bubble"
      d="M160 290c0-100 81-181 181-181h386c100 0 181 81 181 181v300c0 87-62 160-144 177l50 104c6 13-7 25-19 17L632 769H341c-100 0-181-81-181-181Z"
    />
  </defs>

  <g transform="translate(0 24)">
    <use
      href="#bubble"
      transform="translate(-104 -104)"
      fill="#8a8a8a"
      fill-opacity="0.72"
      filter="url(#far-blur)"
    />
    <use
      href="#bubble"
      transform="translate(-52 -52)"
      fill="#555555"
      fill-opacity="0.88"
      filter="url(#near-blur)"
    />
    <use href="#bubble" fill="#202020" />
  </g>
</svg>
